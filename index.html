    <script type="module" crossorigin src="./assets/main-Dk2SNx5B.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-XKyaHtl9.js">
    <link rel="modulepreload" crossorigin href="./assets/hash-C274LNmG.js">
    <link rel="modulepreload" crossorigin href="./assets/Conn-mPTLes8A.js">
    <link rel="stylesheet" crossorigin href="./assets/hash-DDf1sMyf.css">
  </head>
  <body class="game">
    <!-- Classic inline script: runs even where the game's modules can't, so a
         file:// open or a startup error shows a message instead of a blank page. -->
    <script>
      (function () {
        function show(html) {
          var box = document.createElement('div');
          box.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#0f1115;color:#e8eaf0;font:15px/1.5 system-ui,sans-serif;z-index:10';
          box.innerHTML = '<div style="max-width:560px">' + html + '</div>';
          document.body.appendChild(box);
        }
        if (location.protocol === 'file:') {
          show('<h2>MarbleRace needs a web server</h2>' +
            '<p>Browsers block the game\u2019s scripts when a page is opened straight from disk (file://).</p>' +
            '<p>From the project folder run <code>npm run dev</code> and open <code>http://localhost:5173</code>, ' +
            'or run <code>npm run build</code> and serve <code>dist/</code> with any static server (e.g. <code>npx serve dist</code>).</p>');
          return;
        }
        var shown = false;
        function fail(msg) {
          // Once the page has started (data-started), errors stay in the console instead of
          // replacing the page. The ResizeObserver loop notice is a harmless browser warning.
          if (shown || document.documentElement.hasAttribute('data-started')) return;
          if (/^ResizeObserver loop/.test(String(msg))) return;
          shown = true;
          show('<h2>The game failed to start</h2><pre style="white-space:pre-wrap">' + String(msg).replace(/[<&]/g, function (c) { return c === '<' ? '&lt;' : '&amp;'; }) + '</pre>');
        }
        window.addEventListener('error', function (e) { fail(e.message || e); });
        window.addEventListener('unhandledrejection', function (e) { var r = e.reason; fail((r && (r.stack || r.message)) || r); });
      })();
    </script>
    <canvas id="app"></canvas>
    <div class="labels" id="labels"></div>
    <div class="hud" id="hud"></div>
    <div class="ui" id="ui"></div>
  </body>
</html>
